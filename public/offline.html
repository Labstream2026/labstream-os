<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · Labstream OS</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(1200px 600px at 50% -10%, #17171d 0%, #0b0b0e 60%);
        color: #f2f2f3; padding: 28px;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card { width: 100%; max-width: 420px; text-align: center; }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 15px;
        background: #000; color: #fff; display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 22px; letter-spacing: -0.5px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.06);
      }
      h1 { font-size: 21px; font-weight: 650; margin: 0 0 8px; }
      .lead { font-size: 14px; line-height: 1.6; color: #a1a1aa; margin: 0 auto 22px; max-width: 340px; }
      .lead b { color: #d4d4d8; font-weight: 600; }
      .rooms { display: grid; gap: 10px; margin: 0 0 20px; text-align: left; }
      a.room {
        display: flex; align-items: center; gap: 12px; text-decoration: none;
        padding: 13px 15px; border-radius: 13px; color: #f2f2f3;
        background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
        transition: background .15s, border-color .15s;
      }
      a.room:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.16); }
      a.room .ic { font-size: 20px; width: 26px; text-align: center; }
      a.room .tt { display: flex; flex-direction: column; }
      a.room .tt strong { font-size: 14px; font-weight: 600; }
      a.room .tt span { font-size: 12px; color: #8b8b93; }
      a.room .chev { margin-left: auto; color: #6b6b73; }
      .status {
        display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: #a1a1aa;
        padding: 8px 13px; border-radius: 999px; background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.07);
      }
      .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
      .status.online .dot { background: #22c55e; }
      @media (prefers-reduced-motion: no-preference) {
        .status .dot { animation: pulse 1.8s ease-in-out infinite; }
      }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">labs</div>
      <h1>Estás sin conexión</h1>
      <p class="lead">
        Puedes seguir trabajando. <b>Lo que escribas se guarda en este equipo</b> y se sincroniza
        solo cuando vuelva el servidor.
      </p>

      <nav class="rooms" aria-label="Pantallas disponibles sin conexión">
        <a class="room" href="/mis-tareas">
          <span class="ic" aria-hidden="true">✅</span>
          <span class="tt"><strong>Mis tareas</strong><span>Crear, completar y registrar horas</span></span>
          <span class="chev" aria-hidden="true">→</span>
        </a>
        <a class="room" href="/notas">
          <span class="ic" aria-hidden="true">📝</span>
          <span class="tt"><strong>Notas</strong><span>Escribir y editar sin conexión</span></span>
          <span class="chev" aria-hidden="true">→</span>
        </a>
        <a class="room" href="/">
          <span class="ic" aria-hidden="true">🏠</span>
          <span class="tt"><strong>Inicio</strong><span>Lo último que viste</span></span>
          <span class="chev" aria-hidden="true">→</span>
        </a>
      </nav>

      <div class="status" id="estado" role="status">
        <span class="dot"></span>
        <span id="estadoTxt">Reintentando la conexión…</span>
      </div>
    </main>

    <script>
      // Vuelve solo a la app en cuanto regrese la red: escucha el evento del navegador y, por si
      // ese evento no llega (redes que "mienten"), tantea /api/health de fondo cada pocos segundos.
      var yendo = false;
      function volver() {
        if (yendo) return;
        yendo = true;
        // Recarga la MISMA ruta que se intentaba abrir (si el usuario llegó aquí desde /mis-tareas,
        // vuelve a /mis-tareas), no a offline.html.
        location.reload();
      }
      function marcarOnline() {
        var s = document.getElementById("estado");
        var t = document.getElementById("estadoTxt");
        if (s) s.classList.add("online");
        if (t) t.textContent = "Conexión restablecida. Volviendo…";
      }
      window.addEventListener("online", function () { marcarOnline(); setTimeout(volver, 400); });
      async function tantear() {
        try {
          var r = await fetch("/api/health", { cache: "no-store" });
          if (r && r.ok) { marcarOnline(); volver(); return; }
        } catch (e) { /* sigue sin red */ }
      }
      setInterval(tantear, 5000);
    </script>
  </body>
</html>
